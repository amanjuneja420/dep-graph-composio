B_UPDATE_STATUS_CHECK_PROTECTION","label":"branch"},{"from":"GITHUB_CREATE_USER_LIST","to":"GITHUB_UPDATE_USER_LIST","label":"list_id"},{"from":"GITHUB_GET_ORGANIZATION_PROJECT_ITEM","to":"GITHUB_UPDATE_USER_LISTS_FOR_ITEM","label":"item_id"},{"from":"GITHUB_GET_USER_PROJECT_ITEM","to":"GITHUB_UPDATE_USER_LISTS_FOR_ITEM","label":"item_id"},{"from":"GITHUB_LIST_GITHUB_ACTIONS_CACHES_FOR_A_REPOSITORY","to":"GITHUB_UPDATE_USER_LISTS_FOR_ITEM","label":"item_id"},{"from":"GITHUB_LIST_ISSUES_ASSIGNED_TO_THE_AUTHENTICATED_USER","to":"GITHUB_UPDATE_USER_LISTS_FOR_ITEM","label":"item_id"},{"from":"GITHUB_LIST_ORG_PROJECT_VIEW_ITEMS","to":"GITHUB_UPDATE_USER_LISTS_FOR_ITEM","label":"item_id"},{"from":"GITHUB_LIST_PROJECT_ITEMS_FOR_USER","to":"GITHUB_UPDATE_USER_LISTS_FOR_ITEM","label":"item_id"},{"from":"GITHUB_GET_A_PROJECT","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"project_id"},{"from":"GITHUB_GET_A_PROJECT_CARD","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"project_id"},{"from":"GITHUB_GET_A_PROJECT_COLUMN","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"project_id"},{"from":"GITHUB_GET_ORGANIZATION_PROJECT_ITEM","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"project_id"},{"from":"GITHUB_GET_USER_PROJECT_ITEM","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"project_id"},{"from":"GITHUB_GET_USERS_PROJECTS_V2","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"project_id"},{"from":"GITHUB_GET_ORGANIZATION_PROJECT_ITEM","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"item_id"},{"from":"GITHUB_GET_USER_PROJECT_ITEM","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"item_id"},{"from":"GITHUB_LIST_GITHUB_ACTIONS_CACHES_FOR_A_REPOSITORY","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"item_id"},{"from":"GITHUB_LIST_ISSUES_ASSIGNED_TO_THE_AUTHENTICATED_USER","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"item_id"},{"from":"GITHUB_LIST_ORG_PROJECT_VIEW_ITEMS","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"item_id"},{"from":"GITHUB_LIST_PROJECT_ITEMS_FOR_USER","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"item_id"},{"from":"GITHUB_LIST_PROJECT_FIELDS_FOR_USER","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"field_id"},{"from":"GITHUB_ADD_FIELD_TO_USER_PROJECT","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"field_id"},{"from":"GITHUB_DELETE_PROJECT_COLUMN","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"field_id"},{"from":"GITHUB_GET_A_RELEASE","to":"GITHUB_UPLOAD_RELEASE_ASSET","label":"release_id"},{"from":"GITHUB_GET_A_RELEASE_ASSET","to":"GITHUB_UPLOAD_RELEASE_ASSET","label":"release_id"},{"from":"GITHUB_GET_A_RELEASE_BY_TAG_NAME","to":"GITHUB_UPLOAD_RELEASE_ASSET","label":"release_id"},{"from":"GITHUB_GET_THE_LATEST_RELEASE","to":"GITHUB_UPLOAD_RELEASE_ASSET","label":"release_id"},{"from":"GITHUB_LIST_RELEASE_ASSETS","to":"GITHUB_UPLOAD_RELEASE_ASSET","label":"release_id"},{"from":"GITHUB_LIST_RELEASES","to":"GITHUB_UPLOAD_RELEASE_ASSET","label":"release_id"},{"from":"GITHUB_CREATE_OR_UPDATE_FILE_CONTENTS","to":"GITHUB_UPLOAD_RELEASE_ASSET","label":"content_type"},{"from":"GITHUB_GET_A_BRANCH","to":"GITHUB_UPLOAD_SARIF_ANALYSIS","label":"commit_sha"},{"from":"GITHUB_GET_A_COMMIT","to":"GITHUB_UPLOAD_SARIF_ANALYSIS","label":"commit_sha"},{"from":"GITHUB_GET_COMMIT_OBJECT","to":"GITHUB_UPLOAD_SARIF_ANALYSIS","label":"commit_sha"},{"from":"GITHUB_LIST_BRANCHES","to":"GITHUB_UPLOAD_SARIF_ANALYSIS","label":"commit_sha"},{"from":"GITHUB_LIST_BRANCHES_FOR_HEAD_COMMIT","to":"GITHUB_UPLOAD_SARIF_ANALYSIS","label":"commit_sha"},{"from":"GITHUB_LIST_COMMITS","to":"GITHUB_UPLOAD_SARIF_ANALYSIS","label":"commit_sha"},{"from":"GITHUB_GET_DEFAULT_ATTRIBUTES_FOR_A_CODESPACE","to":"GITHUB_VERIFY_DEV_CONTAINER_PERMISSIONS_ACCEPTED","label":"devcontainer_path"},{"from":"GITHUB_LIST_CODESPACES_FOR_A_USER_IN_ORGANIZATION","to":"GITHUB_VERIFY_DEV_CONTAINER_PERMISSIONS_ACCEPTED","label":"devcontainer_path"},{"from":"GITHUB_LIST_CODESPACES_FOR_THE_AUTHENTICATED_USER","to":"GITHUB_VERIFY_DEV_CONTAINER_PERMISSIONS_ACCEPTED","label":"devcontainer_path"},{"from":"GITHUB_LIST_CODESPACES_FOR_THE_ORGANIZATION","to":"GITHUB_VERIFY_DEV_CONTAINER_PERMISSIONS_ACCEPTED","label":"devcontainer_path"},{"from":"GITHUB_LIST_REPO_CODESPACES","to":"GITHUB_VERIFY_DEV_CONTAINER_PERMISSIONS_ACCEPTED","label":"devcontainer_path"},{"from":"GITHUB_LIST_REPO_DEV_CONTAINER_CONFIGS_FOR_USER","to":"GITHUB_VERIFY_DEV_CONTAINER_PERMISSIONS_ACCEPTED","label":"devcontainer_path"}];
const byId = new Map(nodes.map(n => [n.id, n]));

document.getElementById('stats').textContent = nodes.length + ' nodes, ' + rawEdges.length + ' edges';

function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function colorFor(service) {
  if (!service) return 'hsl(220, 8%, 55%)';
  return 'hsl(' + (hash(service) % 360) + ', 60%, 62%)';
}

const services = [...new Set(nodes.map(n => n.service).filter(Boolean))];
const topServices = services
  .map(s => ({ s, n: nodes.filter(n => n.service === s).length }))
  .sort((a, b) => b.n - a.n)
  .slice(0, 18);
document.getElementById('legend').innerHTML =
  '<div style="opacity:0.6;margin-bottom:4px;">service (top ' + topServices.length + ')</div>' +
  topServices.map(({ s, n }) => '<div class="row"><span class="dot" style="background:' + colorFor(s) + '"></span>' + s + ' (' + n + ')</div>').join('');

const NS = 'http://www.w3.org/2000/svg';
const svg = document.querySelector('svg');
const viewport = document.getElementById('viewport');

const hubThreshold = [...nodes.map(n => n.degree)].sort((a, b) => b - a)[Math.min(14, nodes.length - 1)] ?? Infinity;

const edgeEls = rawEdges.map(e => {
  const a = byId.get(e.from), b = byId.get(e.to);
  const el = document.createElementNS(NS, 'path');
  el.setAttribute('class', 'edge');
  if (a && b) el.setAttribute('d', 'M' + a.x + ',' + a.y + ' L' + b.x + ',' + b.y);
  viewport.appendChild(el);
  return { e, el };
});
const nodeEls = nodes.map(n => {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'node' + (n.degree >= hubThreshold ? ' hub' : ''));
  g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('r', String(3 + Math.min(10, Math.sqrt(n.degree + 1) * 2)));
  c.setAttribute('fill', colorFor(n.service));
  const t = document.createElementNS(NS, 'text');
  t.textContent = n.id;
  t.setAttribute('x', '7'); t.setAttribute('y', '3');
  g.appendChild(c); g.appendChild(t);
  viewport.appendChild(g);
  g.addEventListener('click', (ev) => { ev.stopPropagation(); highlight(n.id); });
  return { n, g };
});

let highlighted = null;
function highlight(id) {
  highlighted = highlighted === id ? null : id;
  for (const { e, el } of edgeEls) {
    const on = highlighted && (e.from === highlighted || e.to === highlighted);
    el.classList.toggle('hi', !!on);
    el.classList.toggle('dim', !!highlighted && !on);
  }
  for (const { n, g } of nodeEls) {
    const on = !highlighted || n.id === highlighted || rawEdges.some(e =>
      (e.from === highlighted && e.to === n.id) || (e.to === highlighted && e.from === n.id));
    g.classList.toggle('dim', !on);
    g.classList.toggle('hi', n.id === highlighted);
  }
}
svg.addEventListener('click', () => { if (highlighted) highlight(highlighted); });

document.getElementById('search').addEventListener('input', (ev) => {
  const q = ev.target.value.trim().toUpperCase();
  for (const { n, g } of nodeEls) {
    const match = !!q && (n.id.includes(q) || (n.service ?? '').toUpperCase().includes(q));
    g.classList.toggle('dim', !!q && !match);
    g.classList.toggle('match', match);
  }
  for (const { e, el } of edgeEls) {
    const match = !q || e.from.includes(q) || e.to.includes(q) || (e.label ?? '').toUpperCase().includes(q);
    el.classList.toggle('dim', !!q && !match);
  }
});

// pan/zoom
let tx = 0, ty = 0, scale = Math.max(0.15, Math.min(0.85, 700 / (260 + Math.sqrt(nodes.length) * 26)));
let dragging = false, lastX = 0, lastY = 0, moved = false;
function applyTransform() { viewport.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')'); }
tx = window.innerWidth / 2; ty = window.innerHeight / 2;
applyTransform();
svg.addEventListener('mousedown', (ev) => { dragging = true; moved = false; lastX = ev.clientX; lastY = ev.clientY; svg.classList.add('dragging'); });
window.addEventListener('mouseup', () => { dragging = false; svg.classList.remove('dragging'); });
window.addEventListener('mousemove', (ev) => {
  if (!dragging) return;
  tx += ev.clientX - lastX; ty += ev.clientY - lastY;
  lastX = ev.clientX; lastY = ev.clientY;
  moved = true;
  applyTransform();
});
svg.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const factor = ev.deltaY < 0 ? 1.12 : 0.89;
  scale = Math.max(0.03, Math.min(6, scale * factor));
  applyTransform();
}, { passive: false });
</script>
